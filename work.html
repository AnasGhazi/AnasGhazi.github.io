  <script>
    /* Apply the saved theme and decide whether the page starts behind the curtain, before first paint. */
    (function (d) {
      d.classList.add("js");
      try { var t = localStorage.getItem("theme"); if (t) d.dataset.theme = t; } catch (e) {}
      try {
        var s = sessionStorage, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (s.getItem("pt") || (d.dataset.page === "home" && !s.getItem("intro") && !still)) d.classList.add("covered");
      } catch (e) {}
    })(document.documentElement);
  </script>
  <script src="content.js" defer></script>
  <script src="assets/js/minesweeper.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;display=swap">
